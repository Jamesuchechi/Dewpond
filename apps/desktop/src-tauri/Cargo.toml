[package]
name = "dewpond-desktop"
version = "1.0.0"
description = "Optional signed offline Tauri v2 desktop wrapper for Dewpond"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dewpond_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
